[package]
name = "rust-edge-compute"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"
prost = "0.14.2"
dashmap = "6.1.0"
nvml-wrapper = "0.11.0"
anyhow = "1.0"
ratatui = "0.30.0"
crossterm = "0.29.0"
rand = "0.10.0"
clap = { version = "4.6.0", features = ["derive"] }

[build-dependencies]
prost-build = "0.14.2"
protoc-bin-vendored = "3.2.0"
tonic-build = "0.14.2"
tonic-prost-build = "0.14.2"
